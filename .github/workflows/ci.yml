name: CI

# このリポジトリは複数の実装（AI ツール別）を 1 つにまとめた構成。
# GitHub Actions が読むのは「リポジトリ直下の」.github/workflows/ だけ。
#
# 注意: working-directory には ${{ env.XXX }} を書かない。
# この場所では env コンテキストが解決されず、コマンドがリポジトリ直下で
# 実行されてしまう（他の実装の tests/ まで拾って失敗する）。
# パスはリテラルで書く。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: HEW2026_v1.0_Chatbox_DeepSeek4.1Flash/requirements.txt

      # どこで動いているかを必ずログに残す（失敗時の切り分けが一気に楽になる）
      - name: 作業ディレクトリの確認
        working-directory: HEW2026_v1.0_Chatbox_DeepSeek4.1Flash
        run: |
          echo "pwd = $(pwd)"
          ls

      - name: Install dependencies
        working-directory: HEW2026_v1.0_Chatbox_DeepSeek4.1Flash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest-cov

      - name: "Ruff (blocking: syntax / undefined name)"
        working-directory: HEW2026_v1.0_Chatbox_DeepSeek4.1Flash
        run: ruff check --select E9,F63,F7,F82 .

      - name: Ruff (report only)
        working-directory: HEW2026_v1.0_Chatbox_DeepSeek4.1Flash
        run: ruff check . --exit-zero

      - name: Pytest
        working-directory: HEW2026_v1.0_Chatbox_DeepSeek4.1Flash
        env:
          SECRET_KEY: ci-dummy-secret-key
        run: pytest tests -q --cov=app --cov-report=term-missing

  security:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: HEW2026_v1.0_Chatbox_DeepSeek4.1Flash/requirements.txt

      - name: Install
        working-directory: HEW2026_v1.0_Chatbox_DeepSeek4.1Flash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt bandit pip-audit

      - name: Bandit (static security scan)
        working-directory: HEW2026_v1.0_Chatbox_DeepSeek4.1Flash
        run: bandit -r app -x app/static,app/__pycache__ -ll

      - name: pip-audit (known CVEs in dependencies)
        working-directory: HEW2026_v1.0_Chatbox_DeepSeek4.1Flash
        run: pip-audit -r requirements.txt
        continue-on-error: true
