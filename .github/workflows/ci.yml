name: CI

# このリポジトリは複数の実装（AI ツール別）を 1 つにまとめた構成。
# GitHub Actions が読むのは「リポジトリ直下の」.github/workflows/ だけなので、
# 各実装の中に置いた workflow は動かない。だからテストはここから
# working-directory で対象を指定して実行する。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  PROJECT_DIR: HEW2026_v1.0_Chatbox_DeepSeek4.1Flash

jobs:
  test:
    name: Lint + Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.PROJECT_DIR }}/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest-cov

      - name: "Ruff (blocking: syntax / undefined name)"
        run: ruff check --select E9,F63,F7,F82 .

      - name: Ruff (report only)
        run: ruff check . --exit-zero

      - name: Pytest
        env:
          SECRET_KEY: ci-dummy-secret-key
        run: pytest -q --cov=app --cov-report=term-missing

  security:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ env.PROJECT_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ env.PROJECT_DIR }}/requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt bandit pip-audit

      - name: Bandit (static security scan)
        run: bandit -r app -x app/static,app/__pycache__ -ll

      - name: pip-audit (known CVEs in dependencies)
        run: pip-audit -r requirements.txt
        continue-on-error: true
