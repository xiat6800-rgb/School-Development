<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HEW — 時間のなかで描いた一枚を、競りにかける</title>
<meta name="description" content="制限時間内に描いた絵を下書き保存し、ポイントで入札して落とすオークションシステム。要件定義書 Ver0.5 の画面一式。">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=New+Tegomin&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   HEW Ver0.5 — 画面一式
   版元: 印刷工房の目録（製版のトンボ、値札、判子、台帳）を設計言語にする。
   インクは 5 色だけ。蛍光紅(#FF3D6E) は「いま生きている状態」専用。
   ============================================================ */

/* --- 1. インクと紙の変数 -------------------------------- */
:root {
  /* 紙 3 段 */
  --paper: #efeee9;
  --paper-2: #e4e2da;
  --paper-3: #f7f6f2;

  /* 墨 */
  --ink: #16181c;
  --ink-70: rgba(22, 24, 28, 0.7);
  --ink-45: rgba(22, 24, 28, 0.45);
  --ink-22: rgba(22, 24, 28, 0.22);
  --ink-12: rgba(22, 24, 28, 0.12);

  /* 藍（構造・静） */
  --indigo: #27407f;
  --indigo-soft: rgba(39, 64, 127, 0.16);

  /* 蛍光紅（いま・生きている状態） */
  --spot: #ff3d6e;
  --spot-deep: #b3123e;
  --spot-soft: rgba(255, 61, 110, 0.14);

  --font-display: "New Tegomin", "Hiragino Mincho ProN", "Yu Mincho", "MS PMincho", serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, Consolas, monospace;

  --wrap: 1180px;
  --gap: 20px;
  --radius: 3px;
  --rail-h: 62px;

  --shadow-lift: 0 10px 26px -18px rgba(22, 24, 28, 0.55), 0 2px 0 0 var(--ink);
}

/* --- 2. 基礎 ------------------------------------------- */
*,
*::before,
*::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background-color: var(--paper);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.7;
  font-weight: 400;
  letter-spacing: 0.012em;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* 紙の目（ごく薄い点格子） */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  background-image: radial-gradient(var(--ink) 0.8px, transparent 0.9px);
  background-size: 9px 9px;
  opacity: 0.055;
}

body > * { position: relative; z-index: 1; }

img { max-width: 100%; display: block; }
a { color: var(--indigo); text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { color: var(--spot-deep); }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4, p, ul, ol, dl, figure, blockquote { margin: 0; }
ul, ol { padding: 0; list-style: none; }

:focus-visible {
  outline: 2px solid var(--spot-deep);
  outline-offset: 2px;
  border-radius: 1px;
}

.skip-link {
  position: absolute;
  left: 12px;
  top: -60px;
  z-index: 90;
  background: var(--ink);
  color: var(--paper-3);
  padding: 8px 14px;
  text-decoration: none;
  font-family: var(--font-data);
  font-size: 12px;
  transition: top 0.16s ease;
}
.skip-link:focus { top: 12px; color: var(--paper-3); }

.wrap {
  width: 100%;
  max-width: var(--wrap);
  margin: 0 auto;
  padding: 0 22px;
}

.screen { flex: 1 0 auto; padding-bottom: 72px; }
.screen:focus { outline: none; }

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* --- 3. 版面と罫（トンボ・罫線） ------------------------ */
.tombo-frame {
  background-image:
    linear-gradient(var(--ink-45) 0 0), linear-gradient(var(--ink-45) 0 0),
    linear-gradient(var(--ink-45) 0 0), linear-gradient(var(--ink-45) 0 0),
    linear-gradient(var(--ink-45) 0 0), linear-gradient(var(--ink-45) 0 0),
    linear-gradient(var(--ink-45) 0 0), linear-gradient(var(--ink-45) 0 0);
  background-size: 17px 1px, 17px 1px, 17px 1px, 17px 1px,
                   1px 17px, 1px 17px, 1px 17px, 1px 17px;
  background-position:
    left 0 top 8px, right 0 top 8px, left 0 bottom 8px, right 0 bottom 8px,
    left 8px top 0, right 8px top 0, left 8px bottom 0, right 8px bottom 0;
  background-repeat: no-repeat;
}

.rule {
  border: 0;
  border-top: 1px solid var(--ink-22);
  margin: 0;
}

.rule-strong { border-top: 2px solid var(--ink); }

.halftone {
  background-color: var(--paper-2);
  background-image: radial-gradient(var(--ink-45) 1px, transparent 1.1px);
  background-size: 7px 7px;
}

/* --- 4. 文字 ------------------------------------------- */
.eyebrow {
  font-family: var(--font-data);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--indigo);
  display: flex;
  align-items: center;
  gap: 10px;
}
.eyebrow::after {
  content: "";
  height: 1px;
  flex: 1;
  background: var(--ink-22);
}

h1, .h1 {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(2rem, 4.2vw, 3rem);
  line-height: 1.28;
  letter-spacing: 0.005em;
}

.h2 {
  font-family: var(--font-display);
  font-size: clamp(1.3rem, 1.05rem + 1vw, 1.75rem);
  line-height: 1.35;
}

.h3 {
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 1.0625rem;
  line-height: 1.5;
  letter-spacing: 0.01em;
}

.lede {
  font-size: 1rem;
  color: var(--ink-70);
  max-width: 62ch;
}

.mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.data { font-family: var(--font-data); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.muted { color: var(--ink-70); }
.faint { color: var(--ink-45); }
.small { font-size: 12.5px; }
.strong { font-weight: 700; }
.nowrap { white-space: nowrap; }

.label {
  display: block;
  font-family: var(--font-data);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-70);
  margin-bottom: 5px;
}

.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  border-top: 2px solid var(--ink);
  padding-top: 10px;
  margin-bottom: 18px;
}
.section-head .h2 { flex: 1 1 auto; }
.section-count {
  font-family: var(--font-data);
  font-size: 12px;
  color: var(--ink-70);
}

/* --- 5. ボタン・入力 ----------------------------------- */
.btn {
  --btn-bg: var(--paper-3);
  --btn-fg: var(--ink);
  --btn-bd: var(--ink);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 16px;
  background: var(--btn-bg);
  color: var(--btn-fg);
  border: 1px solid var(--btn-bd);
  border-radius: var(--radius);
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 14px;
  line-height: 1.3;
  text-decoration: none;
  cursor: pointer;
  transition: transform 0.14s ease, box-shadow 0.14s ease, background-color 0.14s ease, color 0.14s ease;
}
.btn:hover { box-shadow: 2px 2px 0 0 var(--ink); transform: translate(-1px, -1px); color: var(--btn-fg); }
.btn:active { box-shadow: none; transform: translate(0, 0); }
.btn[disabled], .btn[aria-disabled="true"] {
  opacity: 0.45;
  cursor: not-allowed;
  box-shadow: none;
  transform: none;
}

.btn-primary { --btn-bg: var(--ink); --btn-fg: var(--paper-3); }
.btn-primary:hover { --btn-fg: var(--paper-3); }

.btn-live { --btn-bg: var(--spot-deep); --btn-fg: #fff; --btn-bd: var(--spot-deep); }
.btn-live:hover { --btn-fg: #fff; }

.btn-ghost { --btn-bg: transparent; --btn-bd: var(--ink-45); }
.btn[aria-pressed="true"] { --btn-bg: var(--indigo); --btn-fg: #fff; --btn-bd: var(--indigo); }
.btn[aria-pressed="true"]:hover { --btn-fg: #fff; }
.btn-sm { padding: 6px 11px; font-size: 12.5px; }
.btn-block { width: 100%; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.field { margin-bottom: 16px; }
.input, .select, .textarea {
  width: 100%;
  background: var(--paper-3);
  border: 1px solid var(--ink-45);
  border-radius: var(--radius);
  padding: 10px 12px;
  font-family: var(--font-body);
  font-size: 15px;
}
.textarea { min-height: 104px; resize: vertical; line-height: 1.7; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--ink); outline: 2px solid var(--spot-deep); outline-offset: 1px; }
.input::placeholder, .textarea::placeholder { color: var(--ink-45); }
.input-data { font-family: var(--font-data); font-variant-numeric: tabular-nums; }

.help { font-size: 12.5px; color: var(--ink-70); margin-top: 5px; }
.problem {
  border-left: 3px solid var(--spot-deep);
  background: var(--spot-soft);
  color: var(--spot-deep);
  padding: 9px 12px;
  font-size: 13px;
  font-weight: 700;
  border-radius: 0 var(--radius) var(--radius) 0;
}
.notice-ink {
  border-left: 3px solid var(--indigo);
  background: var(--indigo-soft);
  padding: 10px 13px;
  font-size: 13px;
  border-radius: 0 var(--radius) var(--radius) 0;
}

.choice-set { display: flex; flex-wrap: wrap; gap: 8px; }

/* --- 6. 判子（タグ） ----------------------------------- */
.stamp {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--ink-45);
  border-radius: 2px;
  padding: 3px 9px 4px;
  font-family: var(--font-data);
  font-size: 12px;
  line-height: 1.4;
  background: var(--paper-3);
  color: var(--ink);
  text-decoration: none;
  box-shadow: inset 0 0 0 1px var(--paper-3), inset 0 0 0 2px var(--ink-12);
}
.stamp:hover { border-color: var(--ink); color: var(--ink); }
.stamp[aria-pressed="true"] {
  background: var(--ink);
  color: var(--paper-3);
  border-color: var(--ink);
  box-shadow: inset 0 0 0 1px var(--ink), inset 0 0 0 2px var(--paper-3);
}
.stamp[aria-pressed="true"]:hover { color: var(--paper-3); }
.stamp-row { display: flex; flex-wrap: wrap; gap: 7px; }

/* --- 7. 札（チケット） --------------------------------- */
.ticket {
  position: relative;
  background: var(--paper-3);
  border: 1px solid var(--ink-22);
  border-radius: var(--radius);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
}
.ticket:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); border-color: var(--ink-45); }
.ticket-link { text-decoration: none; color: inherit; display: flex; flex-direction: column; height: 100%; }
.ticket-link:hover { color: inherit; }

.ticket-plate {
  position: relative;
  aspect-ratio: 4 / 3;
  background: var(--paper-2);
  border-bottom: 1px dashed var(--ink-22);
  overflow: hidden;
}
.ticket-plate img { width: 100%; height: 100%; object-fit: cover; }
.ticket-plate::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: -3px;
  height: 6px;
  background-image: radial-gradient(circle at 4px 3px, var(--paper-3) 2.6px, transparent 2.8px);
  background-size: 12px 6px;
}
.ticket-hole {
  position: absolute;
  top: 9px; left: 9px;
  width: 11px; height: 11px;
  border-radius: 50%;
  background: var(--paper);
  box-shadow: inset 0 0 0 1px var(--ink-22);
  z-index: 2;
}

.ticket-body { padding: 12px 13px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.ticket-title {
  font-family: var(--font-display);
  font-size: 1.1rem;
  line-height: 1.4;
  margin: 0;
}
.ticket-foot {
  margin-top: auto;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 10px;
  border-top: 1px solid var(--ink-12);
  padding-top: 9px;
}

.price-tag {
  position: relative;
  display: inline-flex;
  flex-direction: column;
  gap: 1px;
  background: var(--paper-3);
  border: 1px solid var(--spot-deep);
  border-left: 0;
  border-radius: 0 3px 3px 0;
  padding: 4px 9px 5px 14px;
  clip-path: polygon(9px 0, 100% 0, 100% 100%, 9px 100%, 0 50%);
  min-width: 92px;
}
.price-tag::before {
  content: "";
  position: absolute;
  left: 5px;
  top: 50%;
  width: 3px; height: 3px;
  margin-top: -1.5px;
  border-radius: 50%;
  background: var(--paper-3);
}
.price-tag .pt-label {
  font-family: var(--font-data);
  font-size: 9.5px;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--ink-70);
}
.price-tag .pt-value {
  font-family: var(--font-data);
  font-weight: 600;
  font-size: 15px;
  color: var(--spot-deep);
  white-space: nowrap;
}
.price-tag.is-quiet { border-color: var(--ink-45); }
.price-tag.is-quiet .pt-value { color: var(--ink); }
.price-tag.is-plain { clip-path: none; border-left: 1px solid var(--ink-45); border-radius: 3px; padding-left: 9px; }
.price-tag.is-plain::before { display: none; }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font-data);
  font-size: 10.5px;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  padding: 2px 7px 3px;
  border: 1px solid var(--ink-45);
  border-radius: 2px;
  background: var(--paper-3);
  color: var(--ink-70);
}
.badge-live { border-color: var(--spot); background: var(--spot-soft); color: var(--spot-deep); }
.badge-live::before {
  content: "";
  width: 6px; height: 6px;
  background: var(--spot);
  border-radius: 50%;
}
.badge-ink { background: var(--ink); color: var(--paper-3); border-color: var(--ink); }
.badge-soon { border-style: dashed; }

/* --- 8. 台帳（データ表） ------------------------------- */
.ledger { border-top: 1px solid var(--ink-22); }
.ledger-row {
  display: grid;
  grid-template-columns: var(--ledger-cols, 1fr 1fr);
  gap: 10px;
  align-items: center;
  padding: 9px 2px;
  border-bottom: 1px solid var(--ink-12);
  font-size: 13.5px;
}
.ledger-row.is-me { background: var(--spot-soft); }
.ledger-row.is-me .ledger-amount { color: var(--spot-deep); font-weight: 600; }
.ledger-amount { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.ledger-head {
  display: grid;
  grid-template-columns: var(--ledger-cols, 1fr 1fr);
  gap: 10px;
  padding: 6px 2px;
  border-bottom: 1px solid var(--ink-22);
  font-family: var(--font-data);
  font-size: 10.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-70);
}
.ledger-empty { padding: 22px 2px; color: var(--ink-70); font-size: 13.5px; }

/* --- 9. パネル ----------------------------------------- */
.panel {
  background: var(--paper-3);
  border: 1px solid var(--ink-22);
  border-radius: var(--radius);
  padding: 18px;
}
.panel-ink {
  background: var(--ink);
  color: var(--paper-3);
  border-color: var(--ink);
}
.panel-ink .label, .panel-ink .muted, .panel-ink .help { color: rgba(247, 246, 242, 0.75); }
.panel-ink .eyebrow { color: var(--spot); }
.panel-ink a { color: var(--paper-3); }

.panel-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  border-bottom: 1px solid var(--ink-22);
  padding-bottom: 9px;
  margin-bottom: 14px;
}
.panel-ink .panel-head { border-bottom-color: rgba(247, 246, 242, 0.3); }

.layout-aside {
  display: grid;
  grid-template-columns: minmax(0, 1.55fr) minmax(300px, 0.95fr);
  gap: 26px;
  align-items: start;
}
.grid-plates {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(232px, 1fr));
  gap: 18px;
}

/* --- 10. ヘッダ／フッタ -------------------------------- */
.rail {
  position: sticky;
  top: 0;
  z-index: 40;
  background: rgba(239, 238, 233, 0.94);
  backdrop-filter: blur(7px);
  border-bottom: 1px solid var(--ink);
}
.rail-inner {
  display: flex;
  align-items: center;
  gap: 18px;
  min-height: var(--rail-h);
}
.brand {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  text-decoration: none;
  color: var(--ink);
  flex: 0 0 auto;
}
.brand:hover { color: var(--ink); }
.brand-mark {
  width: 11px; height: 11px;
  background: var(--spot);
  box-shadow: 0 0 0 1px var(--ink);
}
.brand-word {
  font-family: var(--font-display);
  font-size: 1.5rem;
  letter-spacing: 0.06em;
  line-height: 1;
}
.brand-sub {
  font-family: var(--font-data);
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--ink-70);
  border-left: 1px solid var(--ink-22);
  padding-left: 9px;
  line-height: 1.3;
}

.rail-nav {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-left: auto;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.rail-link {
  padding: 6px 10px;
  font-size: 13.5px;
  font-weight: 500;
  color: var(--ink);
  text-decoration: none;
  border: 1px solid transparent;
  border-radius: 2px;
  white-space: nowrap;
  position: relative;
}
.rail-link:hover { border-color: var(--ink-22); background: var(--paper-3); color: var(--ink); }
.rail-link[aria-current="page"] { border-color: var(--ink); background: var(--ink); color: var(--paper-3); }
.wallet-chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  border: 1px solid var(--ink);
  background: var(--paper-3);
  border-radius: 2px;
  padding: 5px 10px;
  font-family: var(--font-data);
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
  color: var(--ink);
  white-space: nowrap;
}
.wallet-chip:hover { color: var(--ink); box-shadow: 2px 2px 0 0 var(--ink); }
.wallet-chip .pt { color: var(--ink-70); font-weight: 400; font-size: 11px; }
.count-dot {
  display: inline-block;
  min-width: 17px;
  padding: 0 5px;
  background: var(--spot);
  color: #fff;
  border-radius: 9px;
  font-family: var(--font-data);
  font-size: 10.5px;
  line-height: 16px;
  text-align: center;
  margin-left: 5px;
  vertical-align: 1px;
}

.colophon {
  border-top: 1px solid var(--ink);
  background: var(--paper-2);
  padding: 30px 0 36px;
  margin-top: auto;
}
.colophon-inner {
  display: grid;
  grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
  gap: 28px;
  align-items: start;
}
.colophon-mark {
  font-family: var(--font-display);
  font-size: 1.4rem;
  letter-spacing: 0.08em;
  margin-bottom: 7px;
}
.colophon-note { font-size: 12.5px; color: var(--ink-70); max-width: 64ch; }
.colophon-meta { font-size: 11.5px; color: var(--ink-70); margin-top: 9px; }
.colophon-label { font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-70); margin-bottom: 6px; }
.colophon-side .btn { margin-top: 10px; }

/* --- 11. ホーム ---------------------------------------- */
.hero {
  display: grid;
  grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
  gap: 34px;
  align-items: center;
  padding: 46px 0 40px;
  border-bottom: 1px solid var(--ink);
}
.hero-copy { display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
.hero h1 { max-width: 13.5em; }
.hero-stroke {
  width: min(100%, 460px);
  height: 14px;
  position: relative;
  overflow: hidden;
}
.hero-stroke span {
  position: absolute;
  inset: 0 auto 0 0;
  width: 100%;
  background: var(--spot);
  clip-path: polygon(0 22%, 99% 0, 100% 74%, 0 96%);
  transform-origin: left center;
  animation: stroke-draw 0.85s cubic-bezier(0.22, 0.68, 0.24, 1) both;
}
.hero-facts {
  display: flex;
  flex-wrap: wrap;
  gap: 9px 22px;
  font-family: var(--font-data);
  font-size: 12px;
  color: var(--ink-70);
  border-top: 1px solid var(--ink-22);
  padding-top: 12px;
  width: 100%;
}
.hero-facts b { color: var(--ink); font-weight: 600; }

/* ホーム右：いま競り中の一枚 */
.live-plate { padding: 14px; }
.live-plate .ticket-plate { border: 1px solid var(--ink-22); border-radius: 2px; }
.live-meta { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; margin-top: 13px; }
.live-clock { display: flex; flex-direction: column; gap: 3px; }
.live-clock .clock-value {
  font-family: var(--font-data);
  font-size: 1.5rem;
  font-weight: 600;
  color: var(--spot-deep);
  letter-spacing: -0.02em;
}
.live-clock.is-closed .clock-value { color: var(--ink); font-weight: 500; }

.stroke-track {
  position: relative;
  height: 9px;
  background: var(--ink-12);
  border: 1px solid var(--ink-22);
  border-radius: 1px;
  overflow: hidden;
  margin-top: 8px;
}
.stroke-track span {
  display: block;
  height: 100%;
  width: 0%;
  background: var(--spot);
  clip-path: polygon(0 0, 100% 0, calc(100% - 3px) 100%, 0 100%);
  transition: width 0.95s linear;
}
.stroke-track.is-urgent span { background: var(--spot-deep); }

.filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 14px 26px;
  align-items: flex-end;
  justify-content: space-between;
  padding: 16px 0 20px;
}
.filter-block { display: flex; flex-direction: column; gap: 7px; }
.filter-block .label { margin-bottom: 0; }
.filter-bar .select { min-width: 170px; padding: 7px 10px; font-size: 13.5px; }

.section { padding-top: 36px; }
.section-tight { padding-top: 24px; }

.empty-state {
  border: 1px dashed var(--ink-45);
  border-radius: var(--radius);
  padding: 30px 24px;
  text-align: left;
  background: var(--paper-3);
}
.empty-state .h3 { margin-bottom: 5px; }
.empty-state p { color: var(--ink-70); font-size: 13.5px; max-width: 58ch; margin-bottom: 14px; }

/* --- 12. 商品詳細 -------------------------------------- */
.work-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
  padding: 22px 0 18px;
}
.work-title { font-family: var(--font-display); font-size: clamp(1.6rem, 1.1rem + 1.9vw, 2.4rem); line-height: 1.3; text-wrap: balance; }
.crumbs { font-family: var(--font-data); font-size: 11.5px; color: var(--ink-70); margin-bottom: 4px; letter-spacing: 0.06em; }

.artwork-frame {
  background: var(--paper-3);
  border: 1px solid var(--ink-22);
  border-radius: var(--radius);
  padding: 14px;
}
.artwork-frame img {
  width: 100%;
  border: 1px solid var(--ink-12);
  background: var(--paper-3);
  aspect-ratio: 4 / 3;
  object-fit: contain;
}
.artwork-caption {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  font-family: var(--font-data);
  font-size: 11px;
  color: var(--ink-70);
  margin-top: 10px;
  letter-spacing: 0.05em;
}

.deflist { display: grid; grid-template-columns: auto 1fr; gap: 7px 16px; font-size: 13.5px; }
.deflist dt { font-family: var(--font-data); font-size: 11.5px; letter-spacing: 0.08em; color: var(--ink-70); padding-top: 2px; }
.deflist dd { margin: 0; }

.bid-price {
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
}
.bid-price .value {
  font-family: var(--font-data);
  font-size: clamp(1.9rem, 1.3rem + 2.2vw, 2.7rem);
  font-weight: 600;
  color: var(--spot-deep);
  letter-spacing: -0.025em;
  line-height: 1.1;
}
.bid-price .unit { font-family: var(--font-data); font-size: 14px; color: var(--ink-70); }

.quick-bid { display: flex; gap: 7px; flex-wrap: wrap; }
.status-line {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 13px;
  border-top: 1px solid var(--ink-12);
  padding-top: 10px;
  margin-top: 12px;
}

/* --- 13. 描画（スタジオ） ------------------------------ */
.studio { padding-top: 22px; max-width: 1010px; }
.studio-time { display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-end; justify-content: space-between; }
.clock {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-family: var(--font-data);
}
.clock-value {
  font-size: clamp(2rem, 1.4rem + 2.6vw, 3rem);
  font-weight: 600;
  line-height: 1;
  letter-spacing: -0.02em;
}
.clock.is-urgent .clock-value { color: var(--spot-deep); }
.clock-label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-70); }

.canvas-stage {
  background: var(--paper-2);
  border: 1px solid var(--ink-22);
  border-radius: var(--radius);
  padding: 16px;
  margin-top: 18px;
}
.canvas-frame {
  position: relative;
  background-color: var(--paper-3);
  background-image: radial-gradient(var(--ink-12) 1px, transparent 1.1px);
  background-size: 22px 22px;
  border: 1px solid var(--ink-45);
  touch-action: none;
  cursor: crosshair;
}
.canvas-frame canvas {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 4 / 3;
  touch-action: none;
}
.canvas-frame.is-locked { cursor: not-allowed; }
.canvas-veil {
  position: absolute;
  inset: 0;
  background: rgba(239, 238, 233, 0.76);
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px;
  font-size: 14px;
  color: var(--ink);
}
.studio-tools { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 16px; }
.tool-group { display: flex; flex-direction: column; gap: 7px; }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; }
.swatch {
  width: 28px; height: 28px;
  border-radius: 50%;
  border: 1px solid var(--ink-45);
  cursor: pointer;
  padding: 0;
  position: relative;
}
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--paper-3), 0 0 0 3px var(--ink); }
.swatch-paper { background: var(--paper-3); }

/* --- 14. アカウント ------------------------------------ */
.tabs { display: flex; flex-wrap: wrap; gap: 0; border-bottom: 1px solid var(--ink); margin-bottom: 20px; }
.tab {
  appearance: none;
  background: transparent;
  border: 1px solid transparent;
  border-bottom: 0;
  padding: 9px 15px;
  font-size: 13.5px;
  font-weight: 700;
  color: var(--ink-70);
  cursor: pointer;
  border-radius: 3px 3px 0 0;
  margin-bottom: -1px;
}
.tab:hover { color: var(--ink); background: var(--paper-3); }
.tab[aria-selected="true"] { background: var(--paper-3); border-color: var(--ink); color: var(--ink); }

.balance-card { display: flex; flex-wrap: wrap; gap: 26px; align-items: flex-end; justify-content: space-between; }
.balance-value { font-family: var(--font-data); font-size: clamp(1.8rem, 1.3rem + 2vw, 2.5rem); font-weight: 600; line-height: 1; }
.balance-value .unit { font-size: 14px; color: var(--ink-70); font-weight: 400; }

.draft-card { display: grid; grid-template-columns: 132px 1fr; gap: 15px; }
.draft-card .draft-plate { border: 1px solid var(--ink-22); background: var(--paper-2); aspect-ratio: 4/3; }
.draft-card .draft-plate img { width: 100%; height: 100%; object-fit: cover; }

/* --- 15. 通知・ボーナス -------------------------------- */
.notice-row {
  display: grid;
  grid-template-columns: 92px 1fr auto;
  gap: 14px;
  align-items: start;
  padding: 13px 4px;
  border-bottom: 1px solid var(--ink-12);
  font-size: 13.5px;
}
.notice-row.is-unread {
  background: linear-gradient(90deg, var(--spot-soft), rgba(255, 61, 110, 0) 62%);
}
.notice-time { font-family: var(--font-data); font-size: 11.5px; color: var(--ink-70); }
.notice-actions { display: flex; gap: 7px; align-items: center; }
.unread-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--spot); display: inline-block; }

.bonus-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 14px;
  align-items: center;
  padding: 14px 4px;
  border-bottom: 1px solid var(--ink-12);
}
.bonus-row .bonus-amount { font-family: var(--font-data); font-weight: 600; font-size: 1.15rem; }

/* --- 16. 将来機能 -------------------------------------- */
.soon-panel { padding: 26px; border: 1px dashed var(--ink-45); border-radius: var(--radius); position: relative; overflow: hidden; }
.soon-panel > * { position: relative; z-index: 1; }
.soon-watermark {
  position: absolute;
  right: -8px;
  bottom: -18px;
  font-family: var(--font-display);
  font-size: 5.4rem;
  color: var(--ink-12);
  letter-spacing: 0.1em;
  z-index: 0;
  pointer-events: none;
  user-select: none;
}
.soon-list { display: grid; gap: 9px; margin-top: 14px; }
.soon-list li { display: grid; grid-template-columns: 84px 1fr; gap: 12px; font-size: 13.5px; align-items: baseline; }

/* --- 17. トースト・ダイアログ -------------------------- */
.toast-region {
  position: fixed;
  right: 18px;
  bottom: 18px;
  z-index: 80;
  display: flex;
  flex-direction: column;
  gap: 9px;
  max-width: min(360px, calc(100vw - 36px));
}
.toast {
  background: var(--ink);
  color: var(--paper-3);
  border-left: 4px solid var(--spot);
  border-radius: 2px;
  padding: 11px 15px;
  font-size: 13.5px;
  box-shadow: 0 14px 30px -18px rgba(22, 24, 28, 0.9);
  animation: toast-in 0.22s ease both;
}
.toast.is-error { border-left-color: var(--spot-deep); }
.toast.is-indigo { border-left-color: var(--indigo); }

.stamp[disabled] { opacity: 0.45; cursor: not-allowed; }
.swatch[disabled] { opacity: 0.45; cursor: not-allowed; }

.dialog-backdrop {
  position: fixed;
  inset: 0;
  z-index: 85;
  background: rgba(22, 24, 28, 0.48);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.dialog {
  background: var(--paper);
  border: 1px solid var(--ink);
  border-radius: var(--radius);
  width: min(560px, 100%);
  max-height: 88vh;
  overflow: auto;
  padding: 24px;
  box-shadow: 0 26px 60px -30px rgba(22, 24, 28, 0.75);
  animation: dialog-in 0.18s ease both;
}
.dialog h2 { margin-bottom: 12px; }
.dialog-body { display: flex; flex-direction: column; gap: 14px; }

@keyframes stroke-draw {
  from { transform: scaleX(0); }
  to { transform: scaleX(1); }
}
@keyframes toast-in {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}
@keyframes dialog-in {
  from { opacity: 0; transform: translateY(10px) scale(0.99); }
  to { opacity: 1; transform: none; }
}
@keyframes rise {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: none; }
}
.rise { animation: rise 0.42s cubic-bezier(0.22, 0.68, 0.24, 1) both; }
.rise-1 { animation-delay: 0.06s; }
.rise-2 { animation-delay: 0.13s; }
.rise-3 { animation-delay: 0.2s; }

/* --- 18. レスポンシブ ---------------------------------- */
@media (max-width: 1000px) {
  .layout-aside { grid-template-columns: minmax(0, 1fr); gap: 22px; }
  .hero { grid-template-columns: minmax(0, 1fr); gap: 26px; padding: 34px 0 30px; }
  .hero h1 { max-width: 16em; }
  .colophon-inner { grid-template-columns: minmax(0, 1fr); gap: 22px; }
  .hero h1 { font-size: clamp(1.55rem, 7vw, 2.1rem); }
  .hero-br { display: none; }
}

@media (max-width: 720px) {
  body { font-size: 14.5px; }
  .rail-inner { flex-wrap: wrap; gap: 10px; padding-top: 9px; padding-bottom: 9px; }
  .rail-nav { width: 100%; margin-left: 0; justify-content: flex-start; overflow-x: auto; flex-wrap: nowrap; padding-bottom: 2px; }
  .brand-sub { display: none; }
  .grid-plates { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 13px; }
  .ticket-title { font-size: 1rem; }
  .work-head { padding: 16px 0 14px; }
  .draft-card { grid-template-columns: 1fr; }
  .notice-row { grid-template-columns: 1fr; gap: 7px; }
  .notice-actions { justify-content: flex-start; }
  .panel { padding: 15px; }
  .canvas-stage { padding: 11px; }
  .toast-region { left: 14px; right: 14px; bottom: 14px; max-width: none; }
  .studio-tools { gap: 14px; }
}

/* --- 19. モーション設定 --------------------------------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
  .ticket:hover { transform: none; }
  .btn:hover { transform: none; box-shadow: none; }
}

@media print {
  .rail, .toasts, .toast-region, .colophon-side, .btn { display: none; }
}

<script>
/* ============================================================
   art.js — デモ用の作品画像をその場で描く
   サーバーに画像を持たないので、seed から SVG を組み立てて
   data URI として渡す。同じ seed なら必ず同じ絵になる。
   rr(rnd, a, b) は「rnd を使って a〜b の実数を返す」補助関数。
   ============================================================ */
(function () {
  "use strict";

  function mulberry32(a) {
    return function () {
      a |= 0;
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const INKS = [
    "#16181c", // 墨
    "#27407f", // 藍
    "#b3123e", // 濃紅
    "#2f6b4f", // 若竹
    "#7b6bb0", // 藤
    "#c98a12"  // 黄土
  ];

  const W = 800;
  const H = 600;

  function rr(rnd, a, b) { return a + rnd() * (b - a); }
  function pick(rnd, arr) { return arr[Math.floor(rnd() * arr.length) % arr.length]; }
  function fx(n) { return Number(n).toFixed(1); }

  /* 手ぶれのある流れる線を 1 本つくる */
  function flowingPath(rnd, x, y, steps, len, drift) {
    let d = "M" + fx(x) + " " + fx(y);
    let angle = rr(rnd, 0, Math.PI * 2);
    for (let i = 0; i < steps; i++) {
      angle += rr(rnd, -drift, drift);
      const nx = x + Math.cos(angle) * len;
      const ny = y + Math.sin(angle) * len;
      const cx = x + Math.cos(angle - 1.1) * len * 0.6;
      const cy = y + Math.sin(angle - 1.1) * len * 0.6;
      d += "Q" + fx(cx) + " " + fx(cy) + " " + fx(nx) + " " + fx(ny);
      x = nx;
      y = ny;
    }
    return d;
  }

  function blobPath(rnd, cx, cy, r, points) {
    const pts = [];
    for (let i = 0; i < points; i++) {
      const a = (Math.PI * 2 * i) / points;
      const rad = r * rr(rnd, 0.74, 1.16);
      pts.push([cx + Math.cos(a) * rad, cy + Math.sin(a) * rad]);
    }
    let d = "M" + fx(pts[0][0]) + " " + fx(pts[0][1]);
    for (let i = 1; i <= pts.length; i++) {
      const p = pts[i % pts.length];
      const q = pts[(i + 1) % pts.length];
      d += "Q" + fx(p[0]) + " " + fx(p[1]) + " " + fx((p[0] + q[0]) / 2) + " " + fx((p[1] + q[1]) / 2);
    }
    return d + "Z";
  }

  function styleFigure(rnd, ink) {
    const cx = rr(rnd, W * 0.34, W * 0.66);
    const cy = rr(rnd, H * 0.42, H * 0.58);
    const r = rr(rnd, 64, 92);
    const out = [];
    out.push('<path d="' + blobPath(rnd, cx, cy, r, 11) + '" fill="none" stroke="' + ink +
      '" stroke-width="3.4" stroke-linejoin="round"/>');
    const ex = r * 0.34;
    out.push('<circle cx="' + fx(cx - ex) + '" cy="' + fx(cy - r * 0.22) + '" r="' + fx(rr(rnd, 4, 8)) + '" fill="' + ink + '"/>');
    out.push('<circle cx="' + fx(cx + ex) + '" cy="' + fx(cy - r * 0.22) + '" r="' + fx(rr(rnd, 4, 8)) + '" fill="' + ink + '"/>');
    out.push('<path d="M' + fx(cx - r * 0.3) + " " + fx(cy + r * 0.3) + "Q" + fx(cx) + " " + fx(cy + r * 0.5) + " " +
      fx(cx + r * 0.3) + " " + fx(cy + r * 0.3) + '" fill="none" stroke="' + ink +
      '" stroke-width="3" stroke-linecap="round"/>');
    for (let i = 0; i < 3; i++) {
      out.push('<path d="' + flowingPath(rnd, rr(rnd, 40, W - 40), rr(rnd, 40, H - 40), 3, rr(rnd, 22, 44), 0.9) +
        '" fill="none" stroke="' + pick(rnd, INKS) + '" stroke-width="2" stroke-linecap="round" opacity="0.75"/>');
    }
    return out.join("");
  }

  function styleLine(rnd) {
    const out = [];
    const n = Math.floor(rr(rnd, 11, 17));
    for (let i = 0; i < n; i++) {
      out.push('<path d="' + flowingPath(rnd, rr(rnd, 60, W - 60), rr(rnd, 60, H - 60),
        Math.floor(rr(rnd, 5, 9)), rr(rnd, 42, 96), 0.95) +
        '" fill="none" stroke="' + pick(rnd, INKS) + '" stroke-width="' + fx(rr(rnd, 2, 5.4)) +
        '" stroke-linecap="round" opacity="' + rr(rnd, 0.72, 1).toFixed(2) + '"/>');
    }
    out.push('<path d="' + blobPath(rnd, rr(rnd, 190, W - 190), rr(rnd, 150, H - 150), rr(rnd, 60, 110), 10) +
      '" fill="none" stroke="' + pick(rnd, INKS) + '" stroke-width="2.6"/>');
    return out.join("");
  }

  function styleIcon(rnd) {
    const ink = pick(rnd, INKS);
    const cx = W / 2;
    const cy = H / 2;
    const r = rr(rnd, 140, 200);
    const out = [];
    out.push('<circle cx="' + cx + '" cy="' + cy + '" r="' + fx(r) + '" fill="none" stroke="' + ink + '" stroke-width="4"/>');
    out.push('<path d="' + blobPath(rnd, cx, cy, r * 0.55, 9) + '" fill="none" stroke="' + pick(rnd, INKS) + '" stroke-width="3"/>');
    for (let i = 0; i < 5; i++) {
      const a = rr(rnd, 0, Math.PI * 2);
      const k1 = rr(rnd, 1.2, 1.5);
      const k2 = rr(rnd, 1.2, 1.5);
      out.push('<line x1="' + fx(cx + Math.cos(a) * r) + '" y1="' + fx(cy + Math.sin(a) * r) +
        '" x2="' + fx(cx + Math.cos(a) * r * k1) + '" y2="' + fx(cy + Math.sin(a) * r * k2) +
        '" stroke="' + pick(rnd, INKS) + '" stroke-width="2.4" stroke-linecap="round"/>');
    }
    return out.join("");
  }

  function styleHatch(rnd) {
    const ink = pick(rnd, INKS);
    const out = [];
    const x0 = rr(rnd, 90, 300);
    const y0 = rr(rnd, 70, 200);
    const bw = rr(rnd, 220, 380);
    const bh = rr(rnd, 200, 320);
    out.push('<rect x="' + fx(x0) + '" y="' + fx(y0) + '" width="' + fx(bw) + '" height="' + fx(bh) +
      '" fill="none" stroke="' + ink + '" stroke-width="3"/>');
    const gap = rr(rnd, 11, 20);
    for (let x = -bh; x < bw + bh; x += gap) {
      out.push('<line x1="' + fx(x0 + x) + '" y1="' + fx(y0 + bh) + '" x2="' + fx(x0 + x + bh) + '" y2="' + fx(y0) +
        '" stroke="' + ink + '" stroke-width="1.5" opacity="0.72"/>');
    }
    out.push('<path d="' + blobPath(rnd, rr(rnd, 140, W - 140), rr(rnd, H * 0.6, H - 80), rr(rnd, 40, 80), 9) +
      '" fill="none" stroke="' + pick(rnd, INKS) + '" stroke-width="3"/>');
    return out.join("");
  }

  /* seed から作品画像（data URI）をつくる */
  function svgArt(seed, style) {
    const rnd = mulberry32((seed * 2654435761) >>> 0);
    const styles = ["figure", "line", "icon", "hatch"];
    const st = style || styles[Math.floor(rnd() * styles.length)];
    let body = "";
    if (st === "figure") body = styleFigure(rnd, pick(rnd, INKS));
    else if (st === "icon") body = styleIcon(rnd);
    else if (st === "hatch") body = styleHatch(rnd);
    else body = styleLine(rnd);

    const svg =
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + " " + H + '" width="' + W + '" height="' + H + '">' +
      '<rect width="' + W + '" height="' + H + '" fill="#f7f6f2"/>' +
      '<g stroke-linecap="round">' + body + "</g>" +
      '<g fill="none" stroke="#16181c" stroke-opacity="0.25" stroke-width="1">' +
      '<circle cx="52" cy="' + (H - 52) + '" r="13"/>' +
      '<path d="M39 ' + (H - 52) + 'h26M52 ' + (H - 65) + 'v26"/></g>' +
      "</svg>";
    return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  }

  window.HEW_ART = { svgArt: svgArt, INKS: INKS };
})();

<script>
/* ============================================================
   store.js — 業務ロジック（ブラウザ内で完結するデモ用の実装）
   要件定義書 Ver0.5 のルールだけを実装する。
   ・入札：開催中 / 終了前 / 自己入札禁止 / 現在価格より大きい / 残高内
   ・受理時に引き落とし、高値更新で前の最高額を返却（同一トランザクション相当）
   ・自動入札：他人の入札に上限額の範囲で上乗せ。同額上限は設定が早い人を優先
   ・終了：終了日時で落札確定。落札時に二重に引き落とさない
   ※ 本物の認証・DB・排他制御ではありません。画面と業務ルールの確認用です。
   ============================================================ */
(function () {
  "use strict";

  const KEY = "hew2027.v05.chatbox.prototype";
  const INCREMENT = 10;                 // 自動入札の上乗せ幅（未決事項の開発用既定値）
  const BONUS = { signup: 500, draw: 50, list: 100 };

  let state = null;
  let memoryOnly = false;               // localStorage が使えない環境の退避

  /* ---------- 小物 ---------- */
  const now = () => Date.now();
  const iso = (ms) => new Date(ms).toISOString();
  const uniq = (arr) => Array.from(new Set(arr));

  function nextId(prefix) {
    state.seq.n += 1;
    return prefix + "-" + state.seq.n;
  }

  function enc(pw) {
    try { return btoa(unescape(encodeURIComponent("hew:" + pw))); }
    catch (e) { return "raw:" + pw; }
  }

  function persist() {
    if (memoryOnly) return;
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) {
      memoryOnly = true;
      console.warn("保存領域に書き込めないため、このタブ内だけで動作します。", e);
    }
  }

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (!parsed || parsed.version !== 1) return null;
      return parsed;
    } catch (e) { return null; }
  }

  /* ---------- 種データの組み立て ---------- */
  function blank() {
    return {
      version: 1,
      seq: { n: 0 },
      users: [],
      artworks: [],
      auctions: [],
      bids: [],
      autoBids: [],
      tx: [],
      notices: [],
      mails: [],
      favWorks: [],
      favAuctions: [],
      bonus: {},
      session: { userId: null },
      meta: { seededAt: null }
    };
  }

  function addUser(username, email, displayName, balance) {
    const u = {
      id: nextId("u"),
      username: username,
      email: email.toLowerCase(),
      pw: enc(window.HEW_DATA.DEV_PASSWORD),
      displayName: displayName,
      balance: 0,
      createdAt: iso(now())
    };
    state.users.push(u);
    // 開発用の初期ポイントは登録ボーナスより先に付与した扱いにする
    credit(u.id, "dev", balance - BONUS.signup, "開発用の初期ポイント", now() - 2000);
    credit(u.id, "signup", BONUS.signup, "登録ボーナス");
    state.bonus[u.id] = { signup: true, draw: false, list: false };
    return u;
  }

  function credit(userId, kind, amount, note, atMs) {
    if (amount === 0) return null;
    const u = user(userId);
    if (!u) return null;
    u.balance += amount;
    const row = {
      id: nextId("t"),
      userId: userId,
      kind: kind,
      amount: amount,
      balanceAfter: u.balance,
      note: note || "",
      createdAt: iso(atMs || now())
    };
    state.tx.push(row);
    return row;
  }

  function buildSeed() {
    state = blank();
    const users = window.HEW_DATA.USERS.map((u) => addUser(u.username, u.email, u.displayName, u.balance));
    const base = now();

    window.HEW_DATA.WORKS.forEach((w, i) => {
      const seller = users[w.seller === undefined ? 1 : w.seller] || users[1];
      const agoMin = w.listedAgoMin || (i + 1) * 186;
      const createdAt = base - agoMin * 60 * 1000;
      const art = {
        id: nextId("a"),
        sellerId: seller.id,
        title: w.title,
        description: w.description,
        tags: w.tags.slice(),
        image: window.HEW_ART.svgArt(w.seed, w.artStyle),
        imageKind: "svg",
        drawSeconds: w.drawSeconds || 30,
        status: "listed",
        createdAt: iso(createdAt),
        listedAt: iso(createdAt)
      };
      state.artworks.push(art);
      state.auctions.push({
        id: nextId("au"),
        artworkId: art.id,
        sellerId: seller.id,
        startPrice: w.startPrice,
        currentPrice: w.startPrice,
        endsAt: iso(base + w.endsIn * 1000),
        createdAt: iso(createdAt),
        status: "active",
        winnerBidId: null,
        finalPrice: null
      });
    });

    // デモアカウントの下書きを 1 枚用意する（すぐ出品の流れを試せるように）
    const demoUser = users[0];
    state.artworks.push({
      id: nextId("a"),
      sellerId: demoUser.id,
      title: "",
      description: "",
      tags: [],
      image: window.HEW_ART.svgArt(window.HEW_DATA.DEMO_DRAFT.seed, window.HEW_DATA.DEMO_DRAFT.artStyle),
      imageKind: "svg",
      drawSeconds: window.HEW_DATA.DEMO_DRAFT.drawSeconds,
      status: "draft",
      createdAt: iso(base - 25 * 60 * 1000),
      listedAt: null
    });

    // デモアカウントのお気に入りを少しだけ入れておく
    if (state.auctions[3]) {
      state.favWorks.push({ userId: demoUser.id, artworkId: state.auctions[3].artworkId, createdAt: iso(base - 60 * 1000) });
    }
    if (state.auctions[6]) {
      state.favWorks.push({ userId: demoUser.id, artworkId: state.auctions[6].artworkId, createdAt: iso(base - 120 * 1000) });
    }
    if (state.auctions[5]) {
      state.favAuctions.push({ userId: demoUser.id, auctionId: state.auctions[5].id, createdAt: iso(base - 90 * 1000) });
    }

    // 入札の履歴を 1 件ずつ実際のルールで処理して作る
    state.auctions.forEach((au, i) => {
      const w = window.HEW_DATA.WORKS[i];
      let rivals = state.users.filter((u) => u.id !== au.sellerId);
      if (!w.demoJoins) {
        const withoutDemo = rivals.filter((u) => u.id !== demoUser.id);
        if (withoutDemo.length) rivals = withoutDemo;
      }
      const step = Math.max(10, Math.round((au.startPrice * 0.16) / 10) * 10);
      const n = Math.min(w.rivals || 0, rivals.length);
      for (let k = 0; k < n; k++) {
        const bidder = rivals[(i + k) % rivals.length];
        const amount = au.startPrice + step * (k + 1);
        placeBid(au.id, amount, "manual", bidder.id, true);
      }
      if (w.autoRival && n > 0) {
        // 自動入札を仕掛けるのは出品者でもデモアカウントでもない相手にする
        const owner = rivals.length > 2 ? rivals[(i + 1) % rivals.length] : rivals[i % rivals.length];
        const challenger = rivals.length > 2 ? rivals[(i + 2) % rivals.length] : rivals[(i + 1) % rivals.length];
        setAutoBid(au.id, owner.id, au.currentPrice + step * 3, true);
        const cur = getAuction(au.id);
        placeBid(au.id, cur.currentPrice + step, "manual", challenger.id, false);
      }
      if (w.demoTops) {
        const cur = getAuction(au.id);
        placeBid(au.id, cur.currentPrice + step, "manual", demoUser.id, true);
      }
    });

    state.meta.seededAt = iso(base);
    closeExpired(true);
    return state;
  }

  /* ---------- 参照 ---------- */
  function user(id) { return state.users.find((u) => u.id === id) || null; }
  function getAuction(id) { return state.auctions.find((a) => a.id === id) || null; }
  function getArtwork(id) { return state.artworks.find((a) => a.id === id) || null; }
  function auctionOfArtwork(artworkId) {
    return state.auctions.find((a) => a.artworkId === artworkId) || null;
  }
  function bidsOf(auctionId) {
    return state.bids
      .filter((b) => b.auctionId === auctionId)
      .sort((a, b) => b.amount - a.amount || Date.parse(a.createdAt) - Date.parse(b.createdAt));
  }
  function topBid(auctionId) { return bidsOf(auctionId)[0] || null; }
  function bidCount(auctionId) { return state.bids.filter((b) => b.auctionId === auctionId).length; }
  function remainingMs(auction) { return Date.parse(auction.endsAt) - now(); }
  function autoBidOf(auctionId, userId) {
    return state.autoBids.find((x) => x.auctionId === auctionId && x.userId === userId && x.active) || null;
  }
  function currentUser() { return state.session.userId ? user(state.session.userId) : null; }
  function isFavWork(userId, artworkId) {
    return state.favWorks.some((f) => f.userId === userId && f.artworkId === artworkId);
  }
  function isFavAuction(userId, auctionId) {
    return state.favAuctions.some((f) => f.userId === userId && f.auctionId === auctionId);
  }
  function noticesOf(userId) {
    return state.notices
      .filter((n) => n.userId === userId)
      .sort((a, b) => Date.parse(b.createdAt) - Date.parse(a.createdAt));
  }
  function unreadCount(userId) { return noticesOf(userId).filter((n) => !n.read).length; }
  function ledgerOf(userId) {
    return state.tx
      .filter((t) => t.userId === userId)
      .sort((a, b) => Date.parse(b.createdAt) - Date.parse(a.createdAt));
  }
  function mailsOf(userId) {
    const u = user(userId);
    if (!u) return [];
    return state.mails
      .filter((m) => m.to === u.email)
      .sort((a, b) => Date.parse(b.createdAt) - Date.parse(a.createdAt));
  }
  function artworksOf(userId) { return state.artworks.filter((a) => a.sellerId === userId); }
  function draftsOf(userId) {
    return artworksOf(userId).filter((a) => a.status === "draft")
      .sort((a, b) => Date.parse(b.createdAt) - Date.parse(a.createdAt));
  }
  function listingsOf(userId) { return state.auctions.filter((a) => a.sellerId === userId); }

  /* 検索：公開作品のみ。複数タグは AND。 */
  function searchWorks(opts) {
    const o = opts || {};
    const tags = o.tags || [];
    let rows = state.artworks
      .filter((a) => a.status !== "draft")
      .map((a) => ({ artwork: a, auction: auctionOfArtwork(a.id) }))
      .filter((r) => r.auction);

    if (tags.length) {
      rows = rows.filter((r) => tags.every((t) => r.artwork.tags.indexOf(t) >= 0));
    }
    if (o.state === "active") rows = rows.filter((r) => r.auction.status === "active");
    if (o.state === "ended") rows = rows.filter((r) => r.auction.status === "closed");

    const sort = o.sort || "ending";
    rows.sort((x, y) => {
      if (sort === "new") return Date.parse(y.artwork.createdAt) - Date.parse(x.artwork.createdAt);
      if (sort === "price") return y.auction.currentPrice - x.auction.currentPrice;
      // 終了が近い順（開催中を先、終了済みは最後）
      const ax = x.auction.status === "active" ? 0 : 1;
      const ay = y.auction.status === "active" ? 0 : 1;
      if (ax !== ay) return ax - ay;
      return Date.parse(x.auction.endsAt) - Date.parse(y.auction.endsAt);
    });
    return rows;
  }

  /* ---------- 認証 ---------- */
  function register(input) {
    const username = (input.username || "").trim();
    const email = (input.email || "").trim().toLowerCase();
    const password = input.password || "";
    const confirm = input.confirm || "";
    if (!username || !email || !password) return { ok: false, message: "ユーザー名・メールアドレス・パスワードはすべて必須です。" };
    if (username.length > 20) return { ok: false, message: "ユーザー名は 20 文字までです。" };
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return { ok: false, message: "メールアドレスの形式を確認してください。" };
    if (password.length < 8) return { ok: false, message: "パスワードは 8 文字以上にしてください。" };
    if (confirm !== "" && confirm !== password) return { ok: false, message: "確認用パスワードが一致しません。" };
    if (state.users.some((u) => u.username.toLowerCase() === username.toLowerCase())) return { ok: false, message: "このユーザー名はすでに使われています。" };
    if (state.users.some((u) => u.email === email)) return { ok: false, message: "このメールアドレスはすでに登録されています。" };

    const u = {
      id: nextId("u"),
      username: username,
      email: email,
      pw: enc(password),
      displayName: username,
      balance: 0,
      createdAt: iso(now())
    };
    state.users.push(u);
    state.bonus[u.id] = { signup: true, draw: false, list: false };
    credit(u.id, "signup", BONUS.signup, "登録ボーナス");
    state.session.userId = u.id;
    notify(u.id, "welcome", "ようこそ HEW へ", "登録ボーナス " + BONUS.signup + " pt を受け取りました。絵を描いて出品してみましょう。", {});
    persist();
    return { ok: true, user: u };
  }

  function login(email, password) {
    const e = (email || "").trim().toLowerCase();
    const u = state.users.find((x) => x.email === e);
    if (!u || u.pw !== enc(password || "")) return { ok: false, message: "メールアドレスまたはパスワードが違います。" };
    state.session.userId = u.id;
    persist();
    return { ok: true, user: u };
  }

  function logout() {
    state.session.userId = null;
    persist();
  }

  function updateDisplayName(name) {
    const u = currentUser();
    if (!u) return { ok: false, message: "ログインが必要です。" };
    const v = (name || "").trim();
    if (!v) return { ok: false, message: "表示名を入力してください。" };
    if (v.length > 24) return { ok: false, message: "表示名は 24 文字までです。" };
    u.displayName = v;
    persist();
    return { ok: true };
  }

  /* ---------- 作品・出品 ---------- */
  function saveDraft(input) {
    const u = currentUser();
    if (!u) return { ok: false, message: "ログインが必要です。" };
    const image = input.image || "";
    if (!/^data:image\/png;base64,/.test(image)) return { ok: false, message: "PNG の形式で保存できませんでした。もう一度お試しください。" };
    // 画像サイズの上限（未決事項の開発用既定値: 4MB）
    if (image.length > 5.5 * 1024 * 1024) return { ok: false, message: "画像が大きすぎます。画面を小さくして描き直してください。" };

    const art = {
      id: nextId("a"),
      sellerId: u.id,
      title: "",
      description: "",
      tags: [],
      image: image,
      imageKind: "png",
      drawSeconds: input.drawSeconds || 0,
      status: "draft",
      createdAt: iso(now()),
      listedAt: null,
      checksumHint: image.length
    };
    state.artworks.push(art);
    persist();
    return { ok: true, artwork: art };
  }

  function updateDraftInfo(artworkId, info) {
    const u = currentUser();
    const art = getArtwork(artworkId);
    if (!u || !art) return { ok: false, message: "作品が見つかりません。" };
    if (art.sellerId !== u.id) return { ok: false, message: "自分の下書きだけを編集できます。" };
    if (art.status !== "draft") return { ok: false, message: "出品済みの作品は編集できません。" };
    art.title = (info.title || "").trim();
    art.description = (info.description || "").trim();
    art.tags = uniq((info.tags || []).filter((t) => window.HEW_DATA.TAGS.indexOf(t) >= 0));
    persist();
    return { ok: true, artwork: art };
  }

  function publish(artworkId, info) {
    const u = currentUser();
    const art = getArtwork(artworkId);
    if (!u || !art) return { ok: false, message: "作品が見つかりません。" };
    if (art.sellerId !== u.id) return { ok: false, message: "自分の下書きだけを出品できます。" };
    if (art.status !== "draft") return { ok: false, message: "この作品はすでに出品されています。" };

    const title = (info.title || "").trim();
    const description = (info.description || "").trim();
    const tags = uniq((info.tags || []).filter((t) => window.HEW_DATA.TAGS.indexOf(t) >= 0));
    const startPrice = Number(info.startPrice);
    const endsAt = info.endsAt;

    if (!title) return { ok: false, message: "タイトルを入力してください。" };
    if (title.length > 60) return { ok: false, message: "タイトルは 60 文字までです。" };
    if (!Number.isFinite(startPrice) || startPrice < 0) return { ok: false, message: "開始価格は 0 以上の整数で入力してください。" };
    if (startPrice % 1 !== 0) return { ok: false, message: "開始価格は整数で入力してください。" };
    if (!tags.length) return { ok: false, message: "タグを 1 つ以上選んでください。" };
    const endMs = Date.parse(endsAt);
    if (!endsAt || !Number.isFinite(endMs)) return { ok: false, message: "終了日時を入力してください。" };
    if (endMs <= now() + 60 * 1000) return { ok: false, message: "終了日時は 1 分より先の時刻を指定してください。" };

    art.title = title;
    art.description = description;
    art.tags = tags;
    art.status = "listed";
    art.listedAt = iso(now());

    const au = {
      id: nextId("au"),
      artworkId: art.id,
      sellerId: u.id,
      startPrice: startPrice,
      currentPrice: startPrice,
      endsAt: iso(endMs),
      createdAt: iso(now()),
      status: "active",
      winnerBidId: null,
      finalPrice: null
    };
    state.auctions.push(au);
    persist();
    return { ok: true, artwork: art, auction: au };
  }

  /* ---------- 通知・メール ---------- */
  function notify(userId, kind, title, body, ref) {
    const n = {
      id: nextId("n"),
      userId: userId,
      kind: kind,
      title: title,
      body: body,
      artworkId: (ref && ref.artworkId) || null,
      auctionId: (ref && ref.auctionId) || null,
      read: false,
      createdAt: iso(now())
    };
    state.notices.push(n);

    const u = user(userId);
    if (u) {
      state.mails.push({
        id: nextId("m"),
        to: u.email,
        subject: "[HEW] " + title,
        body: body,
        status: "queued",       // 送信先 SMTP が未設定のため、実際には送信しない
        attempts: 0,
        sentAt: null,
        error: null,
        createdAt: iso(now())
      });
    }
    return n;
  }

  function markNoticeRead(id) {
    const n = state.notices.find((x) => x.id === id);
    if (n) { n.read = true; persist(); }
  }
  function markAllRead(userId) {
    noticesOf(userId).forEach((n) => { n.read = true; });
    persist();
  }

  /* ---------- 入札 ---------- */
  function placeBid(auctionId, amount, kind, userId, skipAuto) {
    const au = getAuction(auctionId);
    if (!au) return { ok: false, message: "オークションが見つかりません。" };
    const uid = userId || (currentUser() && currentUser().id);
    if (!uid) return { ok: false, message: "ログインが必要です。" };
    const amt = Math.floor(Number(amount));

    if (au.status !== "active") return { ok: false, message: "このオークションはすでに終了しています。" };
    if (remainingMs(au) <= 0) { closeExpired(); return { ok: false, message: "終了日時を過ぎたため、入札を受け付けられません。" }; }
    if (au.sellerId === uid) return { ok: false, message: "自分の出品には入札できません。" };
    if (!Number.isFinite(amt) || amt <= 0) return { ok: false, message: "入札額は 1 pt 以上の整数で入力してください。" };
    if (amt % 1 !== 0) return { ok: false, message: "入札額は整数で入力してください。" };

    const prev = topBid(au.id);
    const floor = Math.max(au.currentPrice, prev ? prev.amount : 0);
    if (amt <= floor) {
      return { ok: false, message: "現在価格 " + floor.toLocaleString("ja-JP") + " pt より高い金額を入力してください。" };
    }
    const me = user(uid);
    const mineFrozen = prev && prev.userId === uid ? prev.amount : 0;
    const available = me.balance + mineFrozen;
    if (amt > available) {
      return {
        ok: false,
        message: "ポイントが足りません。必要 " + amt.toLocaleString("ja-JP") + " pt / 使える " + available.toLocaleString("ja-JP") + " pt",
        needsPoints: true
      };
    }

    /* --- 受理：入札履歴・残高・返却・現在価格をまとめて処理 --- */
    const bid = {
      id: nextId("b"),
      auctionId: au.id,
      userId: uid,
      amount: amt,
      kind: kind || "manual",
      createdAt: iso(now())
    };
    state.bids.push(bid);
    credit(uid, "bid", -amt, "入札（" + artworkLabel(au) + "）");

    if (prev && prev.userId !== uid) {
      credit(prev.userId, "refund", prev.amount, "高値更新の返却（" + artworkLabel(au) + "）");
      notify(prev.userId, "outbid", "最高額を更新されました",
        artworkLabel(au) + " の最高額が " + amt.toLocaleString("ja-JP") + " pt になりました。入札した " + prev.amount.toLocaleString("ja-JP") + " pt は返却されました。",
        { artworkId: au.artworkId, auctionId: au.id });
    }
    au.currentPrice = amt;
    notify(uid, "bid", "入札を受け付けました",
      artworkLabel(au) + " に " + amt.toLocaleString("ja-JP") + " pt で入札しました。現在価格は " + amt.toLocaleString("ja-JP") + " pt です。",
      { artworkId: au.artworkId, auctionId: au.id });

    persist();
    if (!skipAuto) resolveAutoBids(au.id);
    persist();
    return { ok: true, bid: bid, auction: getAuction(au.id) };
  }

  function artworkLabel(au) {
    const art = getArtwork(au.artworkId);
    return art ? "「" + (art.title || "無題") + "」" : "作品";
  }

  /* 自動入札：他人の入札に対して、上限額の範囲で上乗せする */
  function resolveAutoBids(auctionId) {
    let guard = 0;
    while (guard++ < 40) {
      const au = getAuction(auctionId);
      if (!au || au.status !== "active") return;
      const top = topBid(auctionId);
      if (!top) return;
      const candidates = state.autoBids
        .filter((x) => x.auctionId === auctionId && x.active && x.userId !== top.userId && x.maxAmount > top.amount)
        .sort((a, b) => b.maxAmount - a.maxAmount || Date.parse(a.createdAt) - Date.parse(b.createdAt));
      const c = candidates[0];
      if (!c) return;
      const bidder = user(c.userId);
      const available = bidder ? bidder.balance : 0;
      let target = Math.min(c.maxAmount, top.amount + INCREMENT);
      if (available < target) target = Math.min(c.maxAmount, available);
      if (target <= top.amount) {
        c.active = false;                     // 上限または残高に届かないので降りる
        continue;
      }
      const res = placeBid(auctionId, target, "auto", c.userId, true);
      if (!res.ok) { c.active = false; return; }
    }
  }

  function setAutoBid(auctionId, userId, maxAmount, skipResolve) {
    const au = getAuction(auctionId);
    if (!au) return { ok: false, message: "オークションが見つかりません。" };
    const uid = userId || (currentUser() && currentUser().id);
    if (!uid) return { ok: false, message: "ログインが必要です。" };
    const max = Math.floor(Number(maxAmount));
    if (au.status !== "active") return { ok: false, message: "終了したオークションには自動入札を設定できません。" };
    if (remainingMs(au) <= 0) return { ok: false, message: "終了日時を過ぎています。" };
    if (au.sellerId === uid) return { ok: false, message: "自分の出品には自動入札を設定できません。" };
    if (!Number.isFinite(max) || max <= au.currentPrice) {
      return { ok: false, message: "上限額は現在価格 " + au.currentPrice.toLocaleString("ja-JP") + " pt より大きい金額にしてください。" };
    }
    const me = user(uid);
    if (max > me.balance + (topBid(au.id) && topBid(au.id).userId === uid ? topBid(au.id).amount : 0)) {
      return { ok: false, message: "上限額が保有ポイントを超えています。上限は " + me.balance.toLocaleString("ja-JP") + " pt までです。" };
    }
    if (autoBidOf(au.id, uid)) return { ok: false, message: "この作品にはすでに自動入札を設定しています。" };

    const row = {
      id: nextId("ab"),
      auctionId: au.id,
      userId: uid,
      maxAmount: max,
      active: true,
      createdAt: iso(now())
    };
    state.autoBids.push(row);
    notify(uid, "auto", "自動入札を設定しました",
      artworkLabel(au) + " に上限 " + max.toLocaleString("ja-JP") + " pt の自動入札を設定しました。他の人が入札すると、この範囲で自動的に競り上がります。",
      { artworkId: au.artworkId, auctionId: au.id });
    persist();
    if (!skipResolve) { resolveAutoBids(au.id); persist(); }
    return { ok: true, auto: row };
  }

  /* ---------- 終了・落札 ---------- */
  function closeExpired(quiet) {
    let changed = false;
    state.auctions.forEach((au) => {
      if (au.status !== "active") return;
      if (remainingMs(au) > 0) return;
      const top = topBid(au.id);
      au.status = "closed";
      state.autoBids.forEach((x) => { if (x.auctionId === au.id) x.active = false; });
      if (top) {
        au.winnerBidId = top.id;
        au.finalPrice = top.amount;
        notify(top.userId, "won", "落札しました",
          artworkLabel(au) + " を " + top.amount.toLocaleString("ja-JP") + " pt で落札しました。落札額は入札時に差し引かれているため、追加の引き落としはありません。",
          { artworkId: au.artworkId, auctionId: au.id });
        notify(au.sellerId, "sold", "落札されました",
          artworkLabel(au) + " が " + top.amount.toLocaleString("ja-JP") + " pt で落札されました。",
          { artworkId: au.artworkId, auctionId: au.id });
      } else {
        au.winnerBidId = null;
        au.finalPrice = null;
        notify(au.sellerId, "unsold", "入札がないまま終了しました",
          artworkLabel(au) + " は入札がないまま終了しました。Ver0.5 では再出品できません。",
          { artworkId: au.artworkId, auctionId: au.id });
      }
      changed = true;
      if (!quiet) console.info("オークションを終了しました:", au.id);
    });
    if (changed) persist();
    return changed;
  }

  /* ---------- お気に入り ---------- */
  function toggleFavWork(artworkId) {
    const u = currentUser();
    if (!u) return { ok: false, message: "お気に入りの登録にはログインが必要です。" };
    const i = state.favWorks.findIndex((f) => f.userId === u.id && f.artworkId === artworkId);
    if (i >= 0) { state.favWorks.splice(i, 1); persist(); return { ok: true, on: false, message: "作品のお気に入りを解除しました。" }; }
    state.favWorks.push({ userId: u.id, artworkId: artworkId, createdAt: iso(now()) });
    persist();
    return { ok: true, on: true, message: "作品をお気に入りに登録しました。" };
  }

  function toggleFavAuction(auctionId) {
    const u = currentUser();
    if (!u) return { ok: false, message: "お気に入りの登録にはログインが必要です。" };
    const i = state.favAuctions.findIndex((f) => f.userId === u.id && f.auctionId === auctionId);
    if (i >= 0) { state.favAuctions.splice(i, 1); persist(); return { ok: true, on: false, message: "オークションのお気に入りを解除しました。" }; }
    state.favAuctions.push({ userId: u.id, auctionId: auctionId, createdAt: iso(now()) });
    persist();
    return { ok: true, on: true, message: "オークションをお気に入りに登録しました。" };
  }

  function favWorksOf(userId) {
    return state.favWorks
      .filter((f) => f.userId === userId)
      .map((f) => getArtwork(f.artworkId))
      .filter(Boolean);
  }
  function favAuctionsOf(userId) {
    return state.favAuctions
      .filter((f) => f.userId === userId)
      .map((f) => getAuction(f.auctionId))
      .filter(Boolean);
  }

  /* ---------- ボーナスポイント ---------- */
  function bonusItems(userId) {
    const b = state.bonus[userId] || { signup: false, draw: false, list: false };
    const arts = artworksOf(userId);
    return [
      { key: "signup", label: "ユーザー登録", amount: BONUS.signup, done: true, granted: !!b.signup, hint: "登録した時点で付与します。" },
      { key: "draw", label: "はじめて絵を描く", amount: BONUS.draw, done: arts.length > 0, granted: !!b.draw, hint: "下書きを 1 件保存すると受け取れます。" },
      { key: "list", label: "はじめて出品する", amount: BONUS.list, done: listingsOf(userId).length > 0, granted: !!b.list, hint: "作品を 1 件出品すると受け取れます。" }
    ];
  }

  function claimBonus(key) {
    const u = currentUser();
    if (!u) return { ok: false, message: "ログインが必要です。" };
    const item = bonusItems(u.id).find((i) => i.key === key);
    if (!item) return { ok: false, message: "対象のボーナスが見つかりません。" };
    if (item.granted) return { ok: false, message: "すでに受け取り済みです。" };
    if (!item.done) return { ok: false, message: "条件を満たしていません。" };
    state.bonus[u.id][key] = true;
    credit(u.id, "bonus", item.amount, "ボーナスポイント（" + item.label + "）");
    notify(u.id, "bonus", "ボーナスポイントを受け取りました",
      item.label + " のボーナス " + item.amount + " pt を残高に反映しました。", {});
    persist();
    return { ok: true, amount: item.amount };
  }

  /* ---------- 公開API ---------- */
  const api = {
    INCREMENT: INCREMENT,
    BONUS: BONUS,
    init: function () {
      if (state) return state;
      state = load();
      if (!state) buildSeed();
      closeExpired(true);
      return state;
    },
    reset: function () {
      try { localStorage.removeItem(KEY); } catch (e) { /* 無視 */ }
      memoryOnly = false;
      state = buildSeed();
      persist();
      return state;
    },
    dump: function () { return state; },
    isMemoryOnly: function () { return memoryOnly; },

    currentUser: currentUser,
    user: user,
    users: function () { return state.users.slice(); },
    register: register,
    login: login,
    logout: logout,
    updateDisplayName: updateDisplayName,

    tags: function () { return window.HEW_DATA.TAGS.slice(); },
    searchWorks: searchWorks,
    getArtwork: getArtwork,
    getAuction: getAuction,
    auctionOfArtwork: auctionOfArtwork,
    bidsOf: bidsOf,
    topBid: topBid,
    bidCount: bidCount,
    remainingMs: remainingMs,
    autoBidOf: autoBidOf,
    draftsOf: draftsOf,
    listingsOf: listingsOf,
    artworksOf: artworksOf,

    saveDraft: saveDraft,
    updateDraftInfo: updateDraftInfo,
    publish: publish,

    placeBid: placeBid,
    setAutoBid: setAutoBid,
    closeExpired: closeExpired,

    toggleFavWork: toggleFavWork,
    toggleFavAuction: toggleFavAuction,
    isFavWork: isFavWork,
    isFavAuction: isFavAuction,
    favWorksOf: favWorksOf,
    favAuctionsOf: favAuctionsOf,

    noticesOf: noticesOf,
    unreadCount: unreadCount,
    markNoticeRead: markNoticeRead,
    markAllRead: markAllRead,
    mailsOf: mailsOf,
    ledgerOf: ledgerOf,
    credit: credit,

    bonusItems: bonusItems,
    claimBonus: claimBonus
  };

  window.HEW_STORE = api;
})();

</script>
<script>
/* ============================================================
   ui.js — 画面の組み立てと操作
   ハッシュ ルーティング + 1 つの委譲リスナーで動かす。
   1 秒ごとの tick は「生きている数字」だけを書き換える。
   ============================================================ */
(function () {
  "use strict";

  const S = window.HEW_STORE;
  const screenEl = document.getElementById("screen");
  const railEl = document.getElementById("rail-inner");
  const toastRegion = document.getElementById("toast-region");
  const dialogRoot = document.getElementById("dialog-root");

  let mounted = null;      // 現在の画面インスタンス
  let lastFocus = null;

  /* ---------- 文と数字 ---------- */
  function esc(v) {
    return String(v === null || v === undefined ? "" : v).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  const jstFull = new Intl.DateTimeFormat("ja-JP", {
    timeZone: "Asia/Tokyo", year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", hour12: false
  });
  const jstShort = new Intl.DateTimeFormat("ja-JP", {
    timeZone: "Asia/Tokyo", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", hour12: false
  });

  function fmtFull(isoStr) { return jstFull.format(new Date(isoStr)); }
  function fmtShort(isoStr) { return jstShort.format(new Date(isoStr)); }
  function fmtPt(n) { return Number(n || 0).toLocaleString("ja-JP"); }
  function pct(v) { return Math.max(0, Math.min(100, v)) + "%"; }

  function remainText(ms) {
    if (ms <= 0) return "終了";
    const s = Math.floor(ms / 1000);
    const d = Math.floor(s / 86400);
    const h = Math.floor((s % 86400) / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    if (d > 0) return d + "日 " + h + "時間";
    if (h > 0) return h + "時間 " + String(m).padStart(2, "0") + "分";
    return String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
  }

  function clockText(ms) {
    if (ms <= 0) return "00:00";
    const s = Math.ceil(ms / 1000);
    const m = Math.floor(s / 60);
    const sec = s % 60;
    if (m >= 60) return Math.floor(m / 60) + ":" + String(m % 60).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
    return String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
  }

  function durationLabel(sec) {
    if (sec === 10) return "10秒";
    if (sec === 30) return "30秒";
    if (sec === 60) return "1分";
    if (sec === 300) return "5分";
    return sec + "秒";
  }

  function statusBadge(auction) {
    if (!auction) return "";
    if (auction.status === "active") return '<span class="badge badge-live">開催中</span>';
    if (auction.finalPrice === null || auction.finalPrice === undefined) return '<span class="badge badge-soon">落札者なし</span>';
    return '<span class="badge">落札済み</span>';
  }

  /* 開催中は残り時間、終了後は終了日時を出す */
  function cdText(au) {
    if (!au) return "—";
    return au.status === "active" ? remainText(S.remainingMs(au)) : fmtShort(au.endsAt);
  }

  function holderName(userId) {
    const u = S.user(userId);
    return u ? u.displayName : "退会した利用者";
  }

  /* ---------- トースト・ダイアログ ---------- */
  function toast(message, kind) {
    const el = document.createElement("div");
    el.className = "toast" + (kind ? " is-" + kind : "");
    el.setAttribute("role", kind === "error" ? "alert" : "status");
    el.textContent = message;
    toastRegion.appendChild(el);
    window.setTimeout(function () {
      el.style.transition = "opacity .25s ease";
      el.style.opacity = "0";
      window.setTimeout(function () { el.remove(); }, 260);
    }, kind === "error" ? 5200 : 3600);
  }

  function closeDialog() {
    dialogRoot.innerHTML = "";
    if (lastFocus && lastFocus.focus) lastFocus.focus();
    lastFocus = null;
  }

  function openDialog(opts) {
    lastFocus = document.activeElement;
    const actions = (opts.actions || []).map(function (a, i) {
      return '<button type="button" class="btn ' + (a.kind === "primary" ? "btn-primary" : a.kind === "live" ? "btn-live" : "") +
        '" data-dlg="' + i + '">' + esc(a.label) + "</button>";
    }).join("");

    dialogRoot.innerHTML =
      '<div class="dialog-backdrop" data-dlg-close="1">' +
        '<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">' +
          '<h2 class="h2" id="dlg-title">' + esc(opts.title) + "</h2>" +
          '<div class="dialog-body">' + (opts.body || "") + "</div>" +
          '<div class="btn-row" style="margin-top:18px">' + actions + "</div>" +
        "</div>" +
      "</div>";

    const panel = dialogRoot.querySelector(".dialog");
    dialogRoot.querySelectorAll("[data-dlg]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        const a = opts.actions[Number(btn.dataset.dlg)];
        closeDialog();
        if (a && a.onSelect) a.onSelect();
      });
    });
    dialogRoot.querySelector("[data-dlg-close]").addEventListener("mousedown", function (e) {
      if (e.target === e.currentTarget) { closeDialog(); if (opts.onDismiss) opts.onDismiss(); }
    });
    panel.addEventListener("keydown", function (e) {
      if (e.key === "Escape") { closeDialog(); if (opts.onDismiss) opts.onDismiss(); }
      if (e.key === "Tab") {
        const f = panel.querySelectorAll("button, [href], input, select, textarea");
        if (!f.length) return;
        const first = f[0], last = f[f.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      }
    });
    const focusTarget = panel.querySelector("input, textarea, select") || panel.querySelector("button");
    if (focusTarget) focusTarget.focus();
  }

  function currentPath() {
    const raw = (location.hash || "#/").replace(/^#/, "");
    return raw.split("?")[0] || "/";
  }

  function renderRail() {
    const u = S.currentUser();
    const path = currentPath();
    const link = function (href, label, extra) {
      return '<a class="rail-link" href="' + href + '"' +

    let nav = link("#/", "作品を探す") + link("#/draw", "絵を描く");

      nav += link("#/bonus", "ボーナス");
      nav += link("#/notices", "通知", unread ? '<span class="count-dot">' + unread + "</span>" : "");
      nav += link("#/account", "アカウント");

  /* ---------- 部品 ---------- */
  function ticketCard(row, opts) {
    const art = row.artwork;
    const au = row.auction;
    const o = opts || {};
    const active = au && au.status === "active";
    const priceValue = au
      ? (au.finalPrice !== null && au.finalPrice !== undefined ? au.finalPrice : au.currentPrice)
      : null;
    const priceLabel = au && au.status === "closed"
      ? (au.finalPrice === null ? "入札なし" : "落札額")
      : "現在価格";

    return '<article class="ticket' + (o.rise ? " rise" : "") + '">' +
      '<a class="ticket-link" href="#/work/' + art.id + '">' +
        '<div class="ticket-plate">' +
          '<span class="ticket-hole" aria-hidden="true"></span>' +
          '<img src="' + art.image + '" alt="' + esc(art.title || "無題の下書き") + ' の絵" loading="lazy">' +
        "</div>" +
        '<div class="ticket-body">' +
          '<div class="stamp-row">' + art.tags.map(function (t) {
            return '<span class="stamp">' + esc(t) + "</span>";
          }).join("") + "</div>" +
          '<h3 class="ticket-title">' + esc(art.title || "無題") + "</h3>" +
          '<p class="small muted">作者 ' + esc(holderName(art.sellerId)) + " · " + durationLabel(art.drawSeconds) + "で描画</p>" +
          '<div class="ticket-foot">' +
            '<div><span class="label">' + (active ? "残り" : "終了") + "</span>" +
              '<span class="data" data-cd="' + (au ? au.id : "") + '">' + cdText(au) + "</span>" +
            "</div>" +
            '<div class="price-tag' + (active ? "" : " is-quiet") + '">' +
              '<span class="pt-label">' + priceLabel + "</span>" +
              '<span class="pt-value">' + (priceValue === null ? "—" : fmtPt(priceValue) + " pt") + "</span>" +
            "</div>" +
          "</div>" +
        "</div>" +
      "</a>" +
    "</article>";
  }

  function strokeTrack(auction) {
    const total = Date.parse(auction.endsAt) - Date.parse(auction.createdAt);
    const remain = S.remainingMs(auction);
    const elapsed = Math.max(0, Math.min(total, total - remain));
    const w = total > 0 ? (elapsed / total) * 100 : 100;
    const urgent = auction.status === "active" && remain < 5 * 60 * 1000;
    return '<div class="stroke-track' + (urgent ? " is-urgent" : "") + '" data-stroke="' + auction.id + '">' +
      '<span style="width:' + pct(w) + '"></span></div>';
  }

  }

  function viewWork(artworkId) {
    const art = S.getArtwork(artworkId);
    if (!art || art.status === "draft") {
      return notFound("作品が見つかりません", "この作品は非公開か、削除されています。下書きは作者だけが閲覧できます。");
    }
    const au = S.auctionOfArtwork(art.id);
    const me = S.currentUser();
    const isSeller = me && me.id === art.sellerId;
    const top = au ? S.topBid(au.id) : null;
    const count = au ? S.bidCount(au.id) : 0;
    const active = au && au.status === "active" && S.remainingMs(au) > 0;

    const price = au ? (au.finalPrice !== null && au.finalPrice !== undefined ? au.finalPrice : au.currentPrice) : 0;
    const priceLabel = au && au.status === "closed"
      ? (au.finalPrice === null ? "開始価格（入札なし）" : "落札額")
      : "現在価格";

    /* 入札フォーム */
    let bidBlock = "";
    if (!au) {
      bidBlock = '<p class="muted small">この作品にはオークションが設定されていません。</p>';
    } else if (!active) {
      bidBlock = '<div class="notice-ink">' +
        "<p><b>このオークションは終了しました。</b></p>" +
        "<p class=\"small\">" + (au.finalPrice === null
          ? "入札がなかったため、落札者なしで終了しました。Ver0.5 では再出品できません。"
          : "落札者 " + esc(holderName(top ? top.userId : "")) + " / 確定額 " + fmtPt(au.finalPrice) + " pt") + "</p>" +
        "</div>";
      if (au.finalPrice !== null) {
        bidBlock += '<p class="help">落札額は入札の時点で差し引かれているため、落札確定による追加の引き落としはありません。</p>';

      bidBlock = '<div class="notice-ink">' +
        "<p><b>入札にはログインが必要です。</b></p>" +

        '<div class="btn-row" style="margin-top:10px">' +

    } else {
      const mineFrozen = top && top.userId === me.id ? top.amount : 0;

      '<div class="work-head">' +
        "<div>" +
          '<h1 class="work-title">' + esc(art.title || "無題") + "</h1>" +
          '<p class="muted small">作者 ' + esc(holderName(art.sellerId)) + " · " + durationLabel(art.drawSeconds) +
            "で描画 · 出品 " + fmtFull(art.listedAt || art.createdAt) + "（日本時間）</p>" +
        "</div>" +
        '<div class="btn-row">' + statusBadge(au) +
          (me ? '<button type="button" class="btn btn-sm" data-act="fav-work" data-id="' + art.id +
            '" aria-pressed="' + favPressedWork + '">' + (favPressedWork ? "★ 作品のお気に入り済み" : "☆ 作品をお気に入り") + "</button>" : "") +

              return '<span class="stamp">' + esc(t) + "</span>";
            }).join("") + "</div>" +
            '<dl class="deflist" style="margin-top:16px">' +
              "<dt>出品者</dt><dd>" + esc(holderName(art.sellerId)) + "</dd>" +
              "<dt>出品日時</dt><dd class=\"data\">" + fmtFull(art.listedAt || art.createdAt) + "（日本時間）</dd>" +

              "<dt>開始価格</dt><dd class=\"data\">" + fmtPt(au.startPrice) + " pt</dd>" +

    { key: "#27407f", label: "藍" },
    { key: "#b3123e", label: "濃紅" },
    { key: "#ff3d6e", label: "蛍光紅" },
    { key: "#2f6b4f", label: "若竹" },
    { key: "#7b6bb0", label: "藤" },
    { key: "#c98a12", label: "黄土" },
    { key: "#f7f6f2", label: "紙（白）" }

    { v: 30, label: "30秒" },

  function viewDraw() {
    const me = S.currentUser();
    if (!me) {
      return '<div class="wrap section">' +
        '<div class="section-head"><h1 class="h2">絵を描く</h1></div>' +

          '<a class="btn" href="#/register">新規登録</a></div>') +
      "</div>";
    }

    }).join("");

      return '<button type="button" class="stamp" data-pen="' + p.key + '" aria-pressed="' + (i === 0) + '">' + p.label + "</button>";

        '<div class="filter-block">' +

        '<div class="clock" id="draw-clock">' +
          '<span class="clock-label">残り</span>' +

        "</div>" +
        '<div class="btn-row">' +
          '<button type="button" class="btn btn-primary" id="draw-start">描き始める</button>' +
          '<button type="button" class="btn btn-live" id="draw-finish" disabled>完成する（PNGで保存）</button>' +
        "</div>" +
      "</div>" +

      '<div class="stroke-track" id="draw-stroke" style="margin-top:14px"><span></span></div>' +

      '<div class="canvas-stage tombo-frame">' +
        '<div class="studio-tools">' +
          '<div class="tool-group"><span class="label">ペン</span><div class="choice-set" id="pen-set">' + pens + "</div></div>" +
          '<div class="tool-group"><span class="label">太さ</span><div class="choice-set" id="size-set">' + sizes + "</div></div>" +
          '<div class="tool-group"><span class="label">色</span><div class="swatches" id="color-set">' + swatches + "</div></div>" +
          '<div class="tool-group"><span class="label">操作</span><div class="choice-set">' +
            '<button type="button" class="stamp" id="draw-undo">取り消す</button>' +
            '<button type="button" class="stamp" id="draw-clear">全部消す</button>' +
          "</div></div>" +
        "</div>" +
        '<div class="canvas-frame" id="canvas-frame" style="margin-top:14px">' +
          '<canvas id="canvas" width="1000" height="750" aria-label="描画キャンバス"></canvas>' +
          '<div class="canvas-veil" id="canvas-veil">' +
            "<p><b>制限時間を選んで「描き始める」を押してください。</b><br>" +
            '<span class="small">時間切れ、または「完成する」で PNG として下書き保存します。保存した絵に加筆はできません。</span></p>' +

        "</div>" +
      "</div>" +
