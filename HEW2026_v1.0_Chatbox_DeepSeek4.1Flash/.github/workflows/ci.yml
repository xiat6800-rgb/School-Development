name: CI

# いつ動かすか。PR と main への push の両方で回すのが基本。
on:
  push:
    branches: [main]
  pull_request:

# 同じブランチで連続 push したら、古い実行は打ち切る（無駄な課金時間を防ぐ）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest-cov

      # 段階導入: まずは「絶対に直すべきもの」だけを落とす
      # E9=構文エラー, F63/F7/F82=未定義名など。スタイルは後から広げる。
      - name: Ruff (blocking: syntax / undefined name)
        run: ruff check --select E9,F63,F7,F82 .

      # 参考情報として全ルールも見る（落とさない）
      - name: Ruff (report only)
        run: ruff check . --exit-zero

      - name: Pytest
        env:
          # 本物の秘密情報は絶対に置かない。ダミーで十分。
          SECRET_KEY: ci-dummy-secret-key
        run: pytest -q --cov=app --cov-report=term-missing

  security:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt bandit pip-audit

      # ソースコードの静的解析（SQL の組み立て、eval、弱い乱数などを見る）
      # 失敗させたくない指摘は -s でスキップ指定。最初は --exit-zero で観察だけでもよい。
      - name: Bandit (static security scan)
        run: bandit -r app -x app/static,app/__pycache__ -ll

      # 依存パッケージの既知脆弱性。ここが赤いのは「あなたのコードのせい」ではないが、
      # 放置すると本番で漏洞になる。継続的に見る価値がある。
      - name: pip-audit (known CVEs in dependencies)
        run: pip-audit -r requirements.txt
        continue-on-error: true

  # デプロイは「test が緑のときだけ」動く。これが CD の最小形。
  deploy:
    name: Deploy (main only)
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger deploy hook
        # 例: Render / Railway の Deploy Hook URL を Secrets に入れておく
        run: |
          if [ -z "${{ secrets.DEPLOY_HOOK_URL }}" ]; then
            echo "DEPLOY_HOOK_URL が未設定のためスキップします"
            exit 0
          fi
          curl -fsS -X POST "${{ secrets.DEPLOY_HOOK_URL }}"
