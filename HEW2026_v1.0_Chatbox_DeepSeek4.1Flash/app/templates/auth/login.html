{% extends "base.html" %}
{% block title %}ログイン{% endblock %}

{% block content %}
<section class="auth-wrap">
  <div class="auth-card">
    <p class="eyebrow">おかえりなさい</p>
    <h1>ログイン</h1>

    <form method="post" class="stack-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>
        ユーザー名
        <input type="text" name="username" value="{{ form.username }}" required autocomplete="username">
      </label>
      <label>
        パスワード
        <input type="password" name="password" required autocomplete="current-password">
      </label>
      <button type="submit" class="button button-primary">ログイン</button>
    </form>

    <p class="auth-alt">
      アカウントがない方は <a href="{{ url_for('auth.register') }}">新規登録</a>／
      パスワードを忘れた方は <a href="{{ url_for('auth.recover') }}">復旧コードで再設定</a>
    </p>
  </div>
</section>
{% endblock %}
