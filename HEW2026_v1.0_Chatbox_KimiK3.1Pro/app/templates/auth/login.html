{% extends 'base.html' %}{% block title %}ログイン{% endblock %}{% block content %}
<section class="auth-layout"><div class="auth-intro"><span>おかえりなさい</span><h1>今日の競売に、<br>もう一度参加する。</h1><p>メールアドレスは使いません。ユーザー名とパスワードでログインしてください。</p></div><form class="paper-form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><h2>ログイン</h2><label>ユーザー名<input name="username" required autocomplete="username" maxlength="20" autofocus></label><label>パスワード<input type="password" name="password" required autocomplete="current-password"></label><label class="check-row"><input type="checkbox" name="remember" value="1"> このブラウザでログインを保持</label><button class="button button-full" type="submit">ログイン</button><div class="form-links"><a href="{{ url_for('auth.register') }}">新規登録</a><a href="{{ url_for('auth.reset_password') }}">復旧コードで再設定</a></div></form></section>
{% endblock %}
