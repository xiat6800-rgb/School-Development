{% extends 'base.html' %}{% block title %}新規登録{% endblock %}{% block content %}
<section class="auth-layout"><div class="auth-intro"><span>最初の1,000ptを自動付与</span><h1>1枚描くところから。</h1><p>表示名はあとから変更できます。登録直後に一度だけ表示される復旧コードを、安全な場所に保存してください。</p><div class="warning-note"><strong>復旧について</strong>パスワードと復旧コードの両方を失った場合、アカウントを復旧できません。メールアドレスによる再発行はありません。</div></div><form class="paper-form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><h2>新規登録</h2><label>ユーザー名<small>2〜20文字・ログインに使用</small><input name="username" required minlength="2" maxlength="20" autocomplete="username" autofocus></label><label>パスワード<small>8文字以上</small><input type="password" name="password" required minlength="8" autocomplete="new-password"></label><label>パスワード（確認）<input type="password" name="password_confirm" required minlength="8" autocomplete="new-password"></label><button class="button button-full" type="submit">登録して復旧コードを表示</button><p class="form-foot">すでに登録済みなら <a href="{{ url_for('auth.login') }}">ログイン</a></p></form></section>
{% endblock %}
