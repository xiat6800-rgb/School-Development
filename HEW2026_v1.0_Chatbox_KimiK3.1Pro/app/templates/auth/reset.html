{% extends 'base.html' %}{% block title %}パスワード再設定{% endblock %}{% block content %}<section class="narrow-page"><form class="paper-form" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><p class="section-label">アカウント復旧</p><h1>パスワードを再設定</h1><p>登録時の復旧コードを使用します。成功するとコードは無効になります。</p><label>ユーザー名<input name="username" required autocomplete="username"></label><label>復旧コード<input name="recovery_code" required autocomplete="off" placeholder="HEW-XXXX-XXXX-XXXX-XXXX"></label><label>新しいパスワード<input type="password" name="password" required minlength="8" autocomplete="new-password"></label><label>新しいパスワード（確認）<input type="password" name="password_confirm" required minlength="8" autocomplete="new-password"></label><button class="button button-full" type="submit">パスワードを更新</button></form></section>{% endblock %}
