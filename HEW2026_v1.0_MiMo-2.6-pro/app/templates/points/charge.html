{% extends "base.html" %}

{% block content %}
<h1>ポイントチャージ</h1>
<div class="card">

  <div class="row">
    <a class="button secondary" href="{{ url_for('points.show_payment') }}">支払い画面へ</a>
    <a class="button secondary" href="{{ url_for('points.show_bonus_points') }}">ボーナス画面へ</a>
  </div>
</div>
{% endblock %}
