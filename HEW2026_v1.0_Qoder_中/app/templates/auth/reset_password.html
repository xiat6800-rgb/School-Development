{% extends "base.html" %}
{% block title %}パスワード再設定 - HEW{% endblock %}
{% block content %}
<h1>パスワード再設定</h1>
<form method="post" class="form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>ユーザー名
    <input type="text" name="username" maxlength="20" required autofocus>
  </label>
  <label>復旧コード
    <input type="text" name="recovery_code" required>
  </label>
  <label>新しいパスワード（4文字以上）
    <input type="password" name="new_password" minlength="4" required>
  </label>
  <button type="submit">再設定する</button>
</form>
<p>使用した復旧コードは無効になります。ログイン中はアカウント画面から再発行できます。</p>
{% endblock %}
