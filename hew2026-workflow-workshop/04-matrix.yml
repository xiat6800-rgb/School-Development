# ============================================================
# 04 matrix と複数ジョブ — 組み合わせを一気に試す
#   置き場所: .github/workflows/ci.yml
#
#   04 で足すもの:
#     - matrix（Python 3.12/3.13 を同時にテスト）
#     - ジョブを分ける（test / lint）。並列で走るので速い
#     - needs（依存関係）、continue-on-error（赤にしない）
#     - permissions（最小権限。セキュリティの基本）
# ============================================================

name: 04 CI

# 既定のトークン権限は読み取りだけに絞る（乗っ取り時の被害を小さくする）
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      # まずは「絶対に直すべきもの」だけ落とす。スタイルは後から広げる。
      - run: ruff check --select E9,F63,F7,F82 .

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # 1 つ失敗しても他は最後まで走らせる（全体像が見える）
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }} # matrix の値が入る
          cache: pip
          cache-dependency-path: requirements.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: pytest -q

  audit:
    name: 依存の脆弱性チェック
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pip-audit
      # 依存の CVE は自分のコードの問題ではないので、まずは「落とさず観察」
      - run: pip-audit -r requirements.txt
        continue-on-error: true
